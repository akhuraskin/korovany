[package]
name = "korovany"
version = "0.1.0"
edition = "2021"
description = "Корованы — RPG с тремя фракциями, грабежом корованов и системой увечий"
authors = ["Kirill"]

[dependencies]
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
dirs = "5"

[profile.release]
opt-level = 3
lto = true

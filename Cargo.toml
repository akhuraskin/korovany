[package]
name = "korovany"
version = "0.2.0"
edition = "2021"
description = "Корованы — 3D экшн-RPG с тремя фракциями, грабежом корованов и системой увечий"
authors = ["Kirill"]

[dependencies]
bevy = "0.18"
avian3d = "0.5"
cosmic-text = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
dirs = "5"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = true
